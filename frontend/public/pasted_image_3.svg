<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34495E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1920" height="1080" fill="url(#grad1)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Neptun logo placeholder -->
  <g transform="translate(860, 440)">
    <rect x="0" y="0" width="200" height="200" rx="20" fill="rgba(255,255,255,0.1)"/>
    <text x="100" y="100" font-family="Arial, sans-serif" font-size="60" fill="white" text-anchor="middle" alignment-baseline="middle" font-weight="bold">N</text>
    <text x="100" y="130" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.8)" text-anchor="middle" alignment-baseline="middle">Neptun</text>
  </g>

  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="100" fill="rgba(52, 152, 219, 0.2)"/>
  <circle cx="1720" cy="880" r="150" fill="rgba(52, 152, 219, 0.15)"/>
  <circle cx="1600" cy="300" r="80" fill="rgba(52, 152, 219, 0.25)"/>
  <circle cx="300" cy="800" r="120" fill="rgba(52, 152, 219, 0.18)"/>
</svg>

