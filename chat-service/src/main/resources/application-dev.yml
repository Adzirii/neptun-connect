spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/neptun_chat_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
neptun:
  api:
    timeout: 30000

logging:
  level:
    com.thesis.chatservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG

server:
  port: 8080