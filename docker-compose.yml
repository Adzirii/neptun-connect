version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: neptun_chat_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neptun-mock:
    build:
      context: .
      dockerfile: neptun-mock/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/neptun_chat_dev
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - NEPTUN_MOCK_URL=http://neptun-mock:8081
    depends_on:
      - db
      - neptun-mock

volumes:
  postgres_data:

