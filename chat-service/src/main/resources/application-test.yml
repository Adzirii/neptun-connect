# chat-service/src/test/resources/application-test.yml

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-testing-only-must-be-at-least-256-bits-long
  expiration: 86400000

logging:
  level:
    com.thesis.chatservice: DEBUG